# The fuzz workspace, deliberately separate from the product workspace.
#
# Its targets are built with a dated nightly and link a fuzzing runtime, so
# building them is not part of the ordinary gate: a repository whose everyday
# build depended on a nightly would be a repository that stopped building when
# that nightly moved. Every seed here is nonetheless replayed through the
# production parsers by an ordinary test, which does run in the gate.

[package]
name = "slingshot-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
slingshot-configuration = { path = "../crates/slingshot-configuration" }
slingshot-domain = { path = "../crates/slingshot-domain" }
slingshot-agent-connection = { path = "../crates/slingshot-agent-connection" }
slingshot-command-line = { path = "../crates/slingshot-command-line" }
slingshot-agent-protocol = { path = "../crates/slingshot-agent-protocol" }
slingshot-local-protocol = { path = "../crates/slingshot-local-protocol" }

[[bin]]
name = "configuration_document"
path = "fuzz_targets/configuration_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_protocol_server_sent_event"
path = "fuzz_targets/agent_protocol_server_sent_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_protocol_frame"
path = "fuzz_targets/local_protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_context_protocol_message"
path = "fuzz_targets/model_context_protocol_message.rs"
test = false
doc = false
bench = false
