[workspace]
resolver = "3"
members = [
    "crates/slingshot-agent-connection",
    "crates/slingshot-agent-protocol",
    "crates/slingshot-command-line",
    "crates/slingshot-configuration",
    "crates/slingshot-daemon",
    "crates/slingshot-development",
    "crates/slingshot-domain",
    "crates/slingshot-local-protocol",
    "crates/slingshot-storage",
    "crates/slingshot-test-support",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/koraytaylan/slingshot"

[workspace.dependencies]
slingshot-agent-connection = { path = "crates/slingshot-agent-connection" }
slingshot-agent-protocol = { path = "crates/slingshot-agent-protocol" }
slingshot-command-line = { path = "crates/slingshot-command-line" }
slingshot-configuration = { path = "crates/slingshot-configuration" }
slingshot-daemon = { path = "crates/slingshot-daemon" }
slingshot-development = { path = "crates/slingshot-development" }
slingshot-domain = { path = "crates/slingshot-domain" }
slingshot-local-protocol = { path = "crates/slingshot-local-protocol" }
slingshot-storage = { path = "crates/slingshot-storage" }
slingshot-test-support = { path = "crates/slingshot-test-support" }
assert_cmd = { version = "2.2.2" }
base64 = { version = "0.23.1" }
brush-parser = { version = "0.4.0" }
bytes = { version = "1.12.1" }
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
directories = { version = "6.0.0" }
flate2 = { version = "1.1.10" }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
hex = { version = "0.4.3" }
http = { version = "1.5.0" }
http-body-util = { version = "0.1.5" }
hyper = { version = "1.11.1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "server", "http1", "tokio"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
openssl-probe = { version = "0.2.1" }
predicates = { version = "3.1.4" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
proptest = { version = "1.11.0" }
rand = { version = "0.10.2" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process", "pty"] }
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
schemars = { version = "1.2.2" }
secrecy = { version = "0.10.3", features = ["serde"] }
security-framework = { version = "3.7.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde_yaml_ng = { version = "0.10.0" }
sha2 = { version = "0.11.0" }
sqlparser = { version = "0.62.0" }
syn = { version = "3.0.4", features = ["extra-traits", "full", "visit"] }
tar = { version = "0.4.46" }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = { version = "0.7.19" }
toml = { version = "1.1.4" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.8" }
uzers = { version = "0.12.2" }
unicode-normalization = { version = "0.1.25" }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
x509-parser = { version = "0.18.1" }
xattr = { version = "1.6.1", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
