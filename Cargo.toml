[workspace]
resolver = "3"
members = [
    "crates/slingshot-agent-connection",
    "crates/slingshot-agent-protocol",
    "crates/slingshot-command-line",
    "crates/slingshot-configuration",
    "crates/slingshot-daemon",
    "crates/slingshot-development",
    "crates/slingshot-domain",
    "crates/slingshot-local-protocol",
    "crates/slingshot-storage",
    "crates/slingshot-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
