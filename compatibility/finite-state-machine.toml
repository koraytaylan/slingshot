# The one authority for what this repository is compatible with.
#
# Every value here is exact. A field that is missing, repeated, reordered,
# renamed, or given a fallback is a manifest this build refuses, because a
# compatibility claim that could be defaulted is a claim about nothing.

format = "slingshot.finite-state-machine-compatibility/1"
repository = "https://github.com/koraytaylan/fsm"
commit = "7d183e4d7a6b130343ea7d88897e0d029f604813"
model_context_protocol_revision = "2025-06-18"
handler_format = "fsm.handlers/1"
daemon_runtime_contract_format = "slingshot.daemon-runtime-contract/1"
daemon_runtime_contract_sha256 = "165033f6049fc0b6cdbd67002b21950b3c38be6bfadee7ddee07427edda48901"
author_agent_transport_contract_format = "slingshot.author-agent-transport-contract/1"
author_agent_transport_contract_sha256 = "295fc1bdf0b88ecb5cbd45898d9a29d0dae1bada76d6c6fced1e99e7cdb2b9f8"

# What a supplied Cargo-home seed may be. Finite in every dimension, because a
# seed is an arbitrary directory somebody hands this build, and a limit that
# only bounded some dimensions would bound none of them.
[cargo_home_seed]
maximum_files = 65536
maximum_directories = 8192
maximum_component_utf8_bytes = 255
maximum_relative_path_utf8_bytes = 4096
maximum_depth = 64
maximum_file_bytes = 536870912
maximum_aggregate_file_bytes = 8589934592

# How a workflow names one registry command effect. The preimage is fixed here
# and nowhere else, so a digest that changes elsewhere cannot quietly change
# what a key means.
[workflow_effect_operation_key]
preimage_format = "slingshot.workflow-effect-operation-key/1"
key_prefix = "slingshot-workflow-effect-1-"
maximum_input_utf8_bytes = 128
maximum_suffix_bytes = 15
maximum_key_bytes = 107
suffixes = ["", "-backup-restore"]
