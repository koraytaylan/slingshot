serde_json.workspace = true
sha2.workspace = true
slingshot-agent-connection.workspace = true
slingshot-configuration.workspace = true
slingshot-daemon.workspace = true
slingshot-domain.workspace = true
slingshot-local-protocol.workspace = true
slingshot-storage.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
slingshot-test-support.workspace = true
