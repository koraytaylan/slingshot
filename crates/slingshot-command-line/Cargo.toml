[package]
name = "slingshot-command-line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
runtime-test-host = []

[[bin]]
name = "slingshot"
path = "src/main.rs"

[[bin]]
name = "slingshot-runtime-test-host"
path = "tests/support/runtime_test_host.rs"
required-features = ["runtime-test-host"]

[[test]]
name = "walking_skeleton"
required-features = ["runtime-test-host"]

[[test]]
name = "explicit_daemon_start"
required-features = ["runtime-test-host"]

[[test]]
name = "command_golden_sessions"
required-features = ["runtime-test-host"]

[dependencies]
