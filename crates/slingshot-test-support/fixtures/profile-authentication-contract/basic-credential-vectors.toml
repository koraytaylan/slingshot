# Canonical Basic input bytes.
#
# The canonical input is the exact user name bytes, one colon, and the exact
# password bytes. The rows pin that neither side is normalized, that a colon in
# the password is data rather than a second separator, and that an empty
# password is still a password. The base64 column is written independently of
# any encoder in this workspace so the later authorization task has a fixture to
# meet rather than a value to reproduce from its own code.

format = "slingshot.basic-credential-vectors/1"

[[vector]]
user_name = "admin"
password = "admin"
canonical = "admin:admin"
base64 = "YWRtaW46YWRtaW4="

[[vector]]
user_name = "admin"
password = ""
canonical = "admin:"
base64 = "YWRtaW46"

[[vector]]
user_name = "admin"
password = "pass:word"
canonical = "admin:pass:word"
base64 = "YWRtaW46cGFzczp3b3Jk"

[[vector]]
user_name = "oper" 
password = "sécret"
canonical = "oper:sécret"
base64 = "b3Blcjpzw6ljcmV0"

[[vector]]
user_name = "é"
password = "é"
canonical = "é:é"
base64 = "w6k6w6k="
