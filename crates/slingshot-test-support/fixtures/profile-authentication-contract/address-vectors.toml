# Base addresses and the one spelling each of them has.
#
# The accepted rows pin canonicalization: a scheme and host fold to lowercase, a
# port equal to the scheme's default is refused, a root path has no
# representation at all, and a percent escape becomes uppercase. The refused
# rows pin the opposite decision, which is that an ambiguous address is an error
# rather than something to normalize into one of its meanings.

format = "slingshot.address-vectors/1"

[[accepted]]
input = "https://[2001:DB8:0:0:0:0:0:1]:8443/context"
canonical = "https://[2001:db8:0:0:0:0:0:1]:8443/context"
loopback = false
protected = true

[[accepted]]
input = "http://[ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff]"
canonical = "http://[ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff]"
loopback = false
protected = false

[[refused]]
input = "http://[abcd]"
reason = "a hexadecimal string alone is not an IPv6 address"

[[refused]]
input = "http://[:]"
reason = "one colon is not an IPv6 address"

[[refused]]
input = "http://[:::1]"
reason = "three adjacent colons are not IPv6 compression"

[[refused]]
input = "http://[1::2::3]"
reason = "an IPv6 address cannot compress twice"

[[refused]]
input = "http://[12345::1]"
reason = "an IPv6 group exceeds four hexadecimal digits"

[[refused]]
input = "http://[1:2:3]"
reason = "an uncompressed IPv6 address needs eight groups"

[[refused]]
input = "http://[1:2:3:4:5:6:7:8:9]"
reason = "an IPv6 address has too many groups"

[[accepted]]
input = "http://author.example.com:1"
canonical = "http://author.example.com:1"
loopback = false
protected = false

[[accepted]]
input = "https://[::1]:65535"
canonical = "https://[::1]:65535"
loopback = true
protected = true

[[refused]]
input = "https://author.example.com:+8443"
reason = "a port must contain decimal digits only"

[[refused]]
input = "https://author.example.com:+08443"
reason = "a sign cannot bypass the leading-zero port refusal"

[[refused]]
input = "http://[::1]:+4502"
reason = "a bracketed host also requires a digits-only port"

[[accepted]]
input = "http://[::1]"
canonical = "http://[::1]"
loopback = true
protected = false

[[accepted]]
input = "HTTPS://[ABCD::1]:8443/context"
canonical = "https://[abcd::1]:8443/context"
loopback = false
protected = true

[[refused]]
input = "http://[::1]suffix"
reason = "text after a bracketed host is not a port"

[[refused]]
input = "https://[::1].example.com/context"
reason = "a hostname suffix cannot follow a bracketed literal"

[[refused]]
input = "http://[::1]]"
reason = "an extra closing bracket"

[[refused]]
input = "http://[::1]4502"
reason = "a port must start with a colon"

[[refused]]
input = "http://[::1]:"
reason = "an explicit port cannot be empty"

[[refused]]
input = "http://[::1]:4502suffix"
reason = "a port cannot contain a hostname suffix"

[[accepted]]
input = "http://localhost:4502"
canonical = "http://localhost:4502"
loopback = true
protected = false

[[accepted]]
input = "HTTP://LocalHost:4502"
canonical = "http://localhost:4502"
loopback = true
protected = false

[[accepted]]
input = "http://127.0.0.1"
canonical = "http://127.0.0.1"
loopback = true
protected = false

[[accepted]]
input = "http://[::1]:4502"
canonical = "http://[::1]:4502"
loopback = true
protected = false

[[accepted]]
input = "https://author-p123-e456.adobeaemcloud.com"
canonical = "https://author-p123-e456.adobeaemcloud.com"
loopback = false
protected = true

[[accepted]]
input = "https://author.example.com/"
canonical = "https://author.example.com"
loopback = false
protected = true

[[accepted]]
input = "https://author.example.com/context/path"
canonical = "https://author.example.com/context/path"
loopback = false
protected = true

[[accepted]]
input = "https://author.example.com/a%2bb"
canonical = "https://author.example.com/a%2Bb"
loopback = false
protected = true

[[accepted]]
input = "https://author.example.com:8443/context"
canonical = "https://author.example.com:8443/context"
loopback = false
protected = true

[[refused]]
input = "https://author.example.com:443"
reason = "the port repeats the scheme default"

[[refused]]
input = "http://author.example.com:80"
reason = "the port repeats the scheme default"

[[refused]]
input = "ftp://author.example.com"
reason = "the scheme is not one the contract accepts"

[[refused]]
input = "author.example.com"
reason = "no scheme"

[[refused]]
input = "https://operator@author.example.com"
reason = "user information"

[[refused]]
input = "https://author.example.com/context?query=1"
reason = "a query"

[[refused]]
input = "https://author.example.com/context#fragment"
reason = "a fragment"

[[refused]]
input = "https://author.example.com/context/"
reason = "a trailing separator"

[[refused]]
input = "https://author.example.com//context"
reason = "an empty segment"

[[refused]]
input = "https://author.example.com/context/."
reason = "a dot segment"

[[refused]]
input = "https://author.example.com/context/.."
reason = "a dot-dot segment"

[[refused]]
input = "https://author.example.com/context/%2e%2e"
reason = "an encoded dot-dot segment"

[[refused]]
input = "https://author.example.com/context/a%2Fb"
reason = "an encoded separator"

[[refused]]
input = "https://author.example.com/context/a%5Cb"
reason = "an encoded backslash"

[[refused]]
input = "https://author.example.com/context\\path"
reason = "a backslash"

[[refused]]
input = "https://author.example.com/con%74ext"
reason = "an escape spelling an unreserved byte"

[[refused]]
input = "https://author.example.com/café"
reason = "an unescaped non-ASCII byte"

[[refused]]
input = "https://author.example.com:0"
reason = "a zero port"

[[refused]]
input = "https://author.example.com:08443"
reason = "a leading-zero port"

[[refused]]
input = "https://author.example.com:65536"
reason = "a port above the range"

[[refused]]
input = "https://.example.com"
reason = "an empty leading host label"

[[refused]]
input = "https://author.example.com."
reason = "a trailing host dot"

[[refused]]
input = "https://"
reason = "an empty host"
