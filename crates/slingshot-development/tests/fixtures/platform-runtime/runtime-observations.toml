# Deterministic runtime observations for every abstract supported row.
#
# A conforming observation reports the endpoint its row requires, a runtime
# directory only its owner can reach, readiness published in one replacement, a
# child created detached from its starter, a supervisor that retains the exact
# child, and no decision taken from a numeric process identifier. The Windows
# row additionally records that a remote client is refused; a Unix row records
# no such decision, because it has no pipe to refuse one on.

[[observation]]
name = "x86_64-unknown-linux-gnu-conforming"
triple = "x86_64-unknown-linux-gnu"
endpoint-kind = "unix-domain-socket"
owner-lock-held = true
election-lock-held = false
readiness-present = true
endpoint-present = true
current-user-only = true
atomic-readiness = true
detached-child-creation = true
supervision-retained = true
decided-by-process-identifier = false
accepted = true

