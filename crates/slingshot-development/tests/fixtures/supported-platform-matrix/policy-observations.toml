# Deterministic policy observations for every abstract supported-target row.
#
# An accepted observation reports every capability its row requires and the
# native operating system and architecture the row demands. A refused
# observation drops exactly one requirement or claims another machine, so the
# evaluation is falsifiable without owning any of the three machines.

