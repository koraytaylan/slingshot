name: release
on:
  workflow_dispatch:
jobs:
  release-binary-provenance:
    runs-on: linux
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000000
        with:
          persist-credentials: false
      - uses: actions/attest@0000000000000000000000000000000000000000
