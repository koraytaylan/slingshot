# Rejected inventory variant: a capability whose selected package no member manifest declares.
#
# Every non-standard capability names exactly one registry package, one exact
# version, one default-feature choice, one feature set, and the exact target
# triples it is conditioned on. The owning packages and the dependency kinds
# are recorded here and are derived independently from the consumer fixture in
# crates/slingshot-development/tests/fixtures/workspace-capability-inventory,
# so a drift between the two sources fails the inventory assertions.
#
# An empty targets list means the capability applies to every supported target.

format = "slingshot.workspace-capabilities/1"
minimum-rust-version = "1.98.0"
supported-targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[[capability]]
name = "asynchronous-runtime"
purpose = "Run the asynchronous runtime, endpoints, timers, child processes, and a paused clock a deadline can be proved against."
package = "tokio"
version = "1.53.1"
default-features = true
features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"]
targets = []
kinds = ["normal"]
owners = ["slingshot-agent-connection", "slingshot-command-line", "slingshot-daemon", "slingshot-test-support"]

[[capability]]
name = "asynchronous-transport-layer-security"
purpose = "Run the security layer over an asynchronous connection with a separate deadline."
package = "tokio-rustls"
