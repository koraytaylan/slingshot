# Structural family and planned-consumer capability requirements.
#
# One row per structural module family and per explicitly named planned
# capability consumer. Each dependency kind is recorded explicitly: an empty
# list means the kind is unused, and the reserved name `standard-library`
# means the consumer needs no external capability for that kind.
#
# This fixture is authored independently of policy/workspace-capabilities.toml.
# The inventory assertions derive the owning packages and dependency kinds from
# these rows and compare them with the policy file and with Cargo metadata.

format = "slingshot.consumer-capabilities/1"

[[consumer]]
name = "slingshot_domain"
package = "slingshot-domain"
normal = ["typed-errors", "serialization", "unique-identifiers", "secret-buffers"]
build = []
development = ["property-tests"]

[[consumer]]
name = "slingshot_domain::command"
package = "slingshot-domain"
normal = ["typed-errors", "serialization"]
build = []
development = ["property-tests"]

[[consumer]]
name = "slingshot_configuration"
package = "slingshot-configuration"
normal = ["typed-errors", "serialization", "toml-documents", "uniform-resource-locators", "secret-buffers", "platform-directories", "base64-encoding", "descriptor-relative-filesystem", "posix-access-control-lists", "extended-access-control-lists", "windows-security-identifiers", "windows-file-identity"]
build = []
development = ["property-tests", "diagnostics", "diagnostics-subscriber"]

[[consumer]]
name = "slingshot_configuration::testing"
package = "slingshot-configuration"
normal = ["temporary-files", "serialization", "toml-documents"]
build = []
development = []

