# Probe coverage for every candidate capability.
#
# One row per inventory capability, naming the crate that owns the probe, the
# probe module, the dependency kind the probe exercises the capability at, the
# public interface the probe must literally use, and the exact target rows the
# probe applies to. An empty target list means the probe applies everywhere.
#
# This fixture is compared with policy/workspace-capabilities.toml, with the
# probe modules on disk, and with the module declarations in each crate's probe
# entry point, so an uncovered row, a probe without a row, a wrong crate, a
# wrong dependency kind, and a wrong target predicate all fail.

format = "slingshot.capability-probes/1"

[[probe]]
capability = "asynchronous-runtime"
package = "slingshot-daemon"
module = "asynchronous_runtime"
kind = "normal"
interface = ["tokio::runtime::Builder::new_multi_thread", "tokio::time::timeout", "tokio::process::Command"]
targets = []

