# Closed table of external interfaces whose spelling the workspace cannot change.
#
# An implementation is exempt from the full-word rule for one signature only
# when its header literally names the leading-colon fully qualified path below
# and the locked dependency identity matches. An alias, a renamed import, a
# re-export, a glob import, an inferred short path, a lookalike declared here, an
# inherent method, and a project-owned trait are all refused rather than
# resolved: this is interface data, not an abbreviation allowlist, and it makes
# no claim about what a compiler would resolve.
#
# Only the required signature declaration is exempt. Every identifier the
# implementation declares inside that signature's body stays checked.

format = "slingshot.external-interface-identifiers/1"

