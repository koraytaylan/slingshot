# The release, one job per native row, with provenance from the provider.
#
# The order is deliberate. The version a tag names is checked first, because it
# is the one refusal that costs nothing and every job after it is expensive. The
# RustSec review happens next, in a protected environment, and emits one record
# this run is bound to; the cache is prepared once, over the network, on
# purpose; every row then builds twice offline from that cache and compares
# bytes; and only the one attestation job holds a permission beyond reading
# content. The notes are assembled from the history in parallel with all of it,
# because nothing they say depends on how a build turns out.
name: release
on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]*
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The Windows row builds a dependency whose assembly is normally produced by
# NASM, which no runner image is required to carry. The crate ships the same
# assembly prebuilt, so the build uses those objects: they come from the locked
# graph rather than from whatever the image happened to install, which is the
# only form of this that a release could reproduce offline.
env:
  AWS_LC_SYS_PREBUILT_NASM: "1"
jobs:
  release-version:
    name: the version this run publishes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: check the tag against the version the workspace declares
        env:
          SLINGSHOT_RELEASE_REFERENCE_TYPE: ${{ github.ref_type }}
          SLINGSHOT_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/verify_release_version
  release-notes:
    name: the changelog and this release's notes
    needs: release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The notes are the whole history grouped, and the tags are what tells
          # one release from the one before it. A shallow checkout has neither.
          fetch-depth: 0
      - name: write the changelog and the notes from the history
        env:
          SLINGSHOT_RELEASE_REFERENCE_TYPE: ${{ github.ref_type }}
        run: scripts/build_release_notes "$RUNNER_TEMP/notes"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
  rustsec-owner-review:
    name: the same-release advisory review
    needs: release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-rustsec-review
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: validate the committed authority against what this run reports
        env:
          SLINGSHOT_REPORTED_REPOSITORY: ${{ github.repository }}
          SLINGSHOT_REPORTED_REPOSITORY_IDENTIFIER: ${{ github.repository_id }}
          SLINGSHOT_REPORTED_OWNER_IDENTIFIER: ${{ github.repository_owner_id }}
          SLINGSHOT_REPORTED_WORKFLOW: ${{ github.workflow_ref }}
          SLINGSHOT_REPORTED_RUNNER: ubuntu-24.04
        run: cargo run --locked --quiet -p slingshot-development -- github-automation-authority
      - name: check out the exact pinned advisory snapshot
        run: scripts/checkout_pinned_advisory_database "$RUNNER_TEMP/advisory-db"
      - name: verify the pin this release is bound to
        env:
          SLINGSHOT_RUSTSEC_ADVISORY_DATABASE_DIRECTORY: ${{ runner.temp }}/advisory-db
        run: cargo run --locked --quiet -p slingshot-development -- rustsec-advisory-pin
      - name: record the review this run was approved by
        env:
          SLINGSHOT_REVIEW_SOURCE_COMMIT: ${{ github.sha }}
          SLINGSHOT_REVIEW_RUN: ${{ github.run_id }}
          SLINGSHOT_REVIEW_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/record_rustsec_owner_review "$RUNNER_TEMP/review-record.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustsec-owner-review-record
          path: ${{ runner.temp }}/review-record.json
  locked-source-cache:
    name: the one locked source cache
    needs: rustsec-owner-review
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SLINGSHOT_COORDINATOR: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rustsec-owner-review-record
          path: ${{ runner.temp }}/review
      - name: check out the pinned external source
        run: scripts/checkout_pinned_finite_state_machine "$RUNNER_TEMP/finite-state-machine"
      - name: check out the exact pinned advisory snapshot
        run: scripts/checkout_pinned_advisory_database "$RUNNER_TEMP/advisory-db"
      - name: build the pinned coverage-fuzzing tool once
        run: scripts/prepare_coverage_fuzzing_tool --output "$RUNNER_TEMP/coverage-bundle" --host x86_64-unknown-linux-gnu
      - name: prepare the one cache every row builds from
        run: scripts/prepare_locked_source_cache --finite-state-machine-source "$RUNNER_TEMP/finite-state-machine" --rustsec-advisory-database "$RUNNER_TEMP/advisory-db" --rustsec-owner-review-record "$RUNNER_TEMP/review/review-record.json" --coverage-fuzzing-tool-bundle "$RUNNER_TEMP/coverage-bundle" --output-directory "$RUNNER_TEMP/cache"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: locked-source-cache
          path: ${{ runner.temp }}/cache
          include-hidden-files: true
  release-binary-provenance:
    name: the archives and their provenance
    needs: [rustsec-owner-review, locked-source-cache]
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            coordinator: true
          - runner: macos-14
            triple: aarch64-apple-darwin
          - runner: windows-2022
            triple: x86_64-pc-windows-msvc
            coordinator: false
    timeout-minutes: 60
    # How this run reports itself, said once for the row. The packager answers
    # for the authority again before it builds, because the build is what the
    # evidence is about, and a step that answers for a run has to be able to say
    # which run it is. An environment does not travel between steps.
    env:
      SLINGSHOT_REPORTED_REPOSITORY: ${{ github.repository }}
      SLINGSHOT_REPORTED_REPOSITORY_IDENTIFIER: ${{ github.repository_id }}
      SLINGSHOT_REPORTED_OWNER_IDENTIFIER: ${{ github.repository_owner_id }}
      SLINGSHOT_REPORTED_WORKFLOW: ${{ github.workflow_ref }}
      SLINGSHOT_REPORTED_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rustsec-owner-review-record
          path: ${{ runner.temp }}/review
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: locked-source-cache
          path: ${{ runner.temp }}/cache
      - name: validate the committed authority against what this run reports
        run: cargo run --locked --quiet -p slingshot-development -- github-automation-authority
      - name: build this row twice and compare the bytes
        env:
          SLINGSHOT_ROW: ${{ matrix.triple }}
          SLINGSHOT_SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/build_release_artifacts --row "$SLINGSHOT_ROW" --cache-set "$RUNNER_TEMP/cache" --source-commit "$SLINGSHOT_SOURCE_COMMIT" --rustsec-owner-review-record "$RUNNER_TEMP/review/review-record.json" --output-directory "$RUNNER_TEMP/release"
      # The provenance is the provider's own statement about this build, not a
      # document this repository writes. The attestation policy reads the
      # builder identity and the workflow this ran as out of it, and only the
      # provider can say those truthfully, so the provider composes the
      # predicate. The repository's evidence manifest is separate and is
      # verified separately, against the archive it describes.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        id: provenance
        with:
          subject-path: ${{ runner.temp }}/release/*.tar.gz
      # The bundle is what lets somebody authenticate this archive without
      # asking anyone. Left where the action wrote it, it would be reachable
      # only by asking the provider for it later, which is the one thing
      # offline verification must not have to do.
      - name: keep the attestation beside what it attests
        env:
          SLINGSHOT_ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$SLINGSHOT_ATTESTATION_BUNDLE" "$RUNNER_TEMP/release/attestation.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.triple }}
          path: ${{ runner.temp }}/release
  release-acceptance:
    name: the acceptance matrix
    needs: release-binary-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/evidence
      - name: check out the pinned external source
        run: scripts/checkout_pinned_finite_state_machine "$RUNNER_TEMP/finite-state-machine"
      - name: check out the exact pinned advisory snapshot
        run: scripts/checkout_pinned_advisory_database "$RUNNER_TEMP/advisory-db"
      # The decision names which run made it, and only the provider can say that
      # truthfully. An environment does not travel between steps or between
      # jobs, so this job reports itself the way every other job that answers
      # for a run does, and the acceptance passes it on to the container
      # unchanged rather than working it out from anything it can see.
      - name: decide whether this revision is releasable
        env:
          SLINGSHOT_REPORTED_WORKFLOW: ${{ github.workflow_ref }}
        run: scripts/release_acceptance --finite-state-machine-source "$RUNNER_TEMP/finite-state-machine" --rustsec-advisory-database "$RUNNER_TEMP/advisory-db" --rustsec-owner-review-record "$RUNNER_TEMP/evidence/rustsec-owner-review-record/review-record.json" --locked-source-cache "$RUNNER_TEMP/evidence/locked-source-cache" --platform-evidence-directory "$RUNNER_TEMP/evidence" --output-directory "$RUNNER_TEMP/acceptance"
      # Kept whatever was decided. A refused revision is the one occasion the
      # manifest and the gate reports beside it are worth reading, and a step
      # that ran only when everything held would throw them away exactly then.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-acceptance
          path: ${{ runner.temp }}/acceptance
