# External executables the repository-local quality gate runs.
#
# Each tool is pinned to an exact version and to the source it must come from.
# `scripts/quality` verifies every version before it runs a single check, so a
# missing or differently versioned tool is reported before any result is
# produced rather than after. A machine that starts without them - a hosted
# runner does - gets them from `scripts/install_pinned_repository_tools`, which
# reads the versions below rather than repeating them.
#
# No content digest is pinned here. A Rust tool is compiled on the machine that
# installs it and a platform package is built by its distribution, so the bytes
# differ by machine while the behavior the gate depends on is the version. The
# release plan owns attested provenance for the artifacts a release publishes.

format = "slingshot.repository-tools/1"

[[tool]]
name = "cargo-deny"
version = "0.18.6"
source = "registry+https://github.com/rust-lang/crates.io-index"
install = "cargo install --locked cargo-deny --version 0.18.6"
version-check = "cargo deny --version|cargo-deny 0.18.6"
linux-archive = "cargo-deny-0.18.6.crate"
linux-sha256 = "26b71559c7a61f3e31d68466265e430e0d728fd76f5ce95738e5f9d5e5baf37a"

[[tool]]
name = "shellcheck"
version = "0.11.0"
source = "https://github.com/koalaman/shellcheck/releases/tag/v0.11.0"
install = "the platform package manager, or scripts/install_pinned_repository_tools"
version-check = "shellcheck --version|version: 0.11.0"
linux-archive = "shellcheck-v0.11.0.linux.x86_64.tar.xz"
linux-sha256 = "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

[[tool]]
name = "gh"
version = "2.97.0"
source = "https://github.com/cli/cli/releases/tag/v2.97.0"
install = "the platform package manager, or scripts/install_pinned_repository_tools"
version-check = "gh --version|gh version 2.97.0"
linux-archive = "gh_2.97.0_linux_amd64.tar.gz"
linux-sha256 = "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"

[[tool]]
name = "git-cliff"
version = "2.14.1"
source = "https://github.com/orhun/git-cliff/releases/tag/v2.14.1"
install = "scripts/build_release_notes"
version-check = "git-cliff --version|git-cliff 2.14.1"
linux-archive = "git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz"
linux-sha256 = "dfe9bef0c7a00d05fafe78e6e591a1a280d39dd495b8066764db0a559acde67f"
quality-gate = false

[advisory-database]
# The pinned dependency-policy tool looks for the advisory database under this
# exact directory name, derived from the pinned database location. The name
# belongs to the tool version above: replacing that version means checking this
# name again.
directory-name = "advisory-db-3157b0e258782691"

# The pinned tool creates this lock inside the database directory while it
# reads. The gate removes exactly that file when it finishes, so the checkout it
# authenticated at the start is the checkout it leaves behind. It never removes
# anything else and never repairs or advances the database.
lock-file-name = "db.lock"
