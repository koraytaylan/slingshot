# Abstract supported-target authority for Slingshot.
#
# Each row declares one exact target triple, the native operating system and
# architecture a real invocation must run on, the closed capability identifiers
# the target must provide, and the release artifact layout. A row never names a
# continuous-integration provider, a runner image, a linker, a system root, a
# software-development-kit digest, an environment value, or an aggregate
# success claim: those belong to the owner-gated release plan, which maps every
# row to an exact native environment and authenticates its evidence.
#
# Plan 0001 evaluates every row through deterministic policy observations and
# may emit at most one explicitly untrusted observation, for the single row that
# matches the current environment.
#
# Every capability identifier names behavior a safe public Rust interface
# reaches, because the workspace forbids repository-owned unchecked code. The
# Windows row therefore requires an open that refuses to traverse a reparse
# point and a volume-scoped file identifier, which is the widest stable identity
# such an interface exposes today; widening it is release-plan work.

format = "slingshot.supported-platforms/1"

[[target]]
triple = "x86_64-unknown-linux-gnu"
operating-system = "linux"
architecture = "x86_64"
host-class = "native"
executable-stem = "slingshot"
executable-suffix = ""
archive-profile = "tar.gz"
archive-members = ["slingshot", "LICENSE", "SHA256SUMS"]
native-smoke-mode = "direct"
provider-trust-capabilities = [
    "provider-record-distinguished-encoding-rules-bytes",
    "effective-server-authentication-purpose",
    "distrust-or-deny-decision",
    "application-policy-or-name-constraint",
    "unevaluable-decision",
    "conflicting-same-record-decisions",
]
runtime-capabilities = [
    "owner-only-runtime-directory",
    "unix-domain-socket-endpoint",
    "distinct-advisory-owner-lock",
    "distinct-advisory-startup-election-lock",
    "peer-current-user-policy",
    "atomic-same-directory-readiness",
    "session-independent-detachment",
    "stable-supervised-child-cleanup",
]
filesystem-capabilities = [
    "descriptor-relative-no-follow-traversal",
    "descriptor-bound-file-identity",
    "masked-posix-access-control-lists",
]
build-policy-capabilities = [
    "exact-repository-rust-toolchain",
    "exact-target-triple",
    "incremental-compilation-disabled",
    "closed-build-environment",
    "source-path-remapping",
    "build-root-remapping",
    "source-date-from-source-object",
    "native-linker-system-root-or-software-development-kit-observation",
    "no-ambient-archive-program",
]

