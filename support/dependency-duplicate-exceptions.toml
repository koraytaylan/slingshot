# Exact reviewed duplicate versions, partitioned by independently locked graph.
# Each exemption expires when either its named versions or its introducing path
# changes; the development contract compares this document to both locks.
format = "slingshot.dependency-duplicate-exceptions/1"

[product]
cargo-deny-skip = ["base64@0.22.1", "darling@0.20.11", "darling_core@0.20.11", "darling_macro@0.20.11", "getrandom@0.2.17", "hashbrown@0.16.1", "syn@2.0.119", "untrusted@0.7.1", "windows-sys@0.52.0"]

[fuzz]
cargo-deny-skip = ["base64@0.22.1", "getrandom@0.2.17", "hashbrown@0.16.1", "syn@2.0.119", "untrusted@0.7.1", "windows-sys@0.52.0"]

# The graph/package/version tuple is the identity. `paths` identifies the
# reviewed introducer, and `review` makes every entry explicitly renewable.
[[exception]]
graph = "product"
package = "base64"
versions = ["0.22.1", "0.23.1"]
paths = ["jsonwebtoken -> base64", "slingshot-domain -> base64"]
reason = "jsonwebtoken has not converged"
owner = "repository-owner"
review = "remove when jsonwebtoken converges"
[[exception]]
graph = "product"
package = "darling"
versions = ["0.20.11", "0.24.1"]
paths = ["serde_with -> darling", "schemars -> darling"]
reason = "macro ecosystems have independent releases"
owner = "repository-owner"
review = "remove when macro dependencies converge"
[[exception]]
graph = "product"
package = "darling_core"
versions = ["0.20.11", "0.24.1"]
paths = ["serde_with -> darling_core", "schemars -> darling_core"]
reason = "paired with darling"
owner = "repository-owner"
review = "remove with darling"
[[exception]]
graph = "product"
package = "darling_macro"
versions = ["0.20.11", "0.24.1"]
paths = ["serde_with -> darling_macro", "schemars -> darling_macro"]
reason = "paired with darling"
owner = "repository-owner"
review = "remove with darling"
[[exception]]
graph = "product"
package = "getrandom"
versions = ["0.2.17", "0.3.4", "0.4.3"]
paths = ["ring -> getrandom", "uuid -> getrandom", "rand -> getrandom"]
reason = "cryptography and rand release lines differ"
owner = "repository-owner"
review = "remove when upstream converges"
